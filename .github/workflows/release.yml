name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: static-${{ matrix.target }}
      # `--features static` builds libnetcdf + libhdf5 from source (cmake) and
      # links them statically: the binary has no runtime dependency on libnetcdf.
      - name: Build
        run: cargo build --release --locked --features static --target ${{ matrix.target }}
      - name: Package
        run: |
          set -euo pipefail
          name="om2nc-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/om2nc" "dist/${name}"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "${name}"; else shasum -a 256 "${name}"; fi > "${name}.sha256"
          cat "${name}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: cd dist && cat *.sha256 > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
