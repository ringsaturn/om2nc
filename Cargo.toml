[package]
name = "om2nc"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
description = "Fetch Open-Meteo spatial .om forecasts from S3 and write CF-compliant NetCDF"
repository = "https://github.com/ringsaturn/om2nc"
rust-version = "1.88"

[dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
env_logger = "0.11"
log = "0.4"
ndarray = "0.17"
netcdf = "0.12"
omfiles = { git = "https://github.com/open-meteo/rust-omfiles", rev = "86ae9eae05eff36e249230acc87c9fb516c29418" }
opendal = { version = "0.59", default-features = false, features = ["services-s3", "layers-retry", "layers-timeout", "http-transport-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[features]
default = []
# Build libnetcdf + libhdf5 from source and link statically (portable single binary).
static = ["netcdf/static"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
